# PrivaPace operator on Arc Testnet: PostgreSQL + operator.
#   cp operator.env.example operator.env && openssl rand -hex 24 > db_password.txt
#   docker compose up -d --build
# The API is published on 127.0.0.1 only. Expose /health and /checkpoint
# deliberately (reverse proxy or tunnel) if you want others to compare with you.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: operator
      POSTGRES_DB: operator
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operator -d operator"]
      interval: 10s
      timeout: 5s
      retries: 10
  operator:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: operator.env
    secrets: [db_password]
    entrypoint: ["/bin/sh", "-c", "export DATABASE_URL=\"postgresql://operator:$$(cat /run/secrets/db_password)@db:5432/operator\"; exec node_modules/.bin/tsx src/main.ts"]
    ports: ["127.0.0.1:8788:8788"]
secrets:
  db_password:
    file: ./db_password.txt
volumes:
  pgdata:
